# Weekly batch — Release Radar (Monday cron), per PLAN.md section 4.
# GitHub releases.atom feeds for core tracked repos; used with FRESH_HOURS=192
# so a weekly run covers the full week. The pre-judge noise filter drops
# patch releases (x.y.Z) and pre-release tags automatically — only minor/major
# releases reach judgment.
#
# LWKD / KubeWeekly are deliberately NOT collected: they are curations
# themselves (re-judging them dilutes value) — use manually as a leads check.

